<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070709">
<title>JackCasino — Virtual Game</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#070709;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:active{transform:scale(.97)}

:root{
 --gold:#f7c948;
 --gold2:#ffdf75;
 --purple:#8b5cf6;
 --purple2:#c084fc;
 --red:#ef4444;
 --green:#34d399;
 --panel:#111116;
 --panel2:#17171e;
 --line:rgba(255,255,255,.08);
}

.hidden{display:none!important}

.app{
 min-height:100vh;
 background:
 radial-gradient(circle at 20% -10%,rgba(139,92,246,.20),transparent 32%),
 radial-gradient(circle at 100% 10%,rgba(247,201,72,.09),transparent 28%),
 #070709;
}

.topbar{
 position:sticky;
 top:0;
 z-index:50;
 height:66px;
 padding:0 15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:rgba(7,7,9,.86);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--line);
}

.logo{
 font-size:21px;
 font-weight:950;
 letter-spacing:1.5px;
}
.logo span{color:var(--gold)}

.balance{
 display:flex;
 align-items:center;
 gap:7px;
 padding:8px 12px;
 border-radius:13px;
 background:rgba(247,201,72,.08);
 border:1px solid rgba(247,201,72,.20);
 color:var(--gold2);
 font-weight:900;
}

.coin{
 width:19px;height:19px;border-radius:50%;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#fff0a4,#dcae2b);
 color:#694d00;
 font-size:11px;font-weight:1000;
 box-shadow:0 0 14px rgba(247,201,72,.25);
}

.page{
 padding:18px 14px 105px;
 max-width:900px;
 margin:auto;
}

.hero{
 padding:23px 18px;
 border-radius:25px;
 background:
 linear-gradient(135deg,rgba(139,92,246,.22),rgba(247,201,72,.06)),
 #111116;
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 20px 60px rgba(0,0,0,.35);
 margin-bottom:18px;
 position:relative;
 overflow:hidden;
}

.hero:after{
 content:"";
 position:absolute;
 width:180px;height:180px;
 right:-65px;top:-80px;
 border-radius:50%;
 background:rgba(247,201,72,.08);
 filter:blur(5px);
}

.hero small{
 color:#aaaab5;
 font-weight:700;
}
.hero h1{
 margin:7px 0 8px;
 font-size:31px;
 line-height:1;
 letter-spacing:-1.2px;
}
.hero p{
 color:#9b9ba5;
 margin:0;
 line-height:1.45;
 font-size:14px;
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:22px 2px 11px;
}
.section-head h2{
 margin:0;
 font-size:20px;
}
.section-head span{
 color:#777783;
 font-size:12px;
 font-weight:800;
}

.new-player{
 margin:14px 0;
 padding:13px 14px;
 border-radius:17px;
 background:linear-gradient(90deg,rgba(139,92,246,.13),rgba(247,201,72,.06));
 border:1px solid rgba(139,92,246,.24);
 display:flex;
 align-items:center;
 gap:12px;
}
.new-player .np-icon{
 width:38px;height:38px;border-radius:12px;
 display:grid;place-items:center;
 background:rgba(139,92,246,.17);
 font-size:19px;
}
.new-player strong{display:block;font-size:13px}
.new-player p{
 margin:3px 0 0;
 color:#9696a2;
 font-size:11px;
 line-height:1.35;
}

.search{
 display:flex;
 gap:9px;
 margin:13px 0;
}
.search input{
 flex:1;
 min-width:0;
 padding:13px 15px;
 border-radius:14px;
 outline:none;
 border:1px solid var(--line);
 background:#111116;
 color:#fff;
 font-size:14px;
}
.search input:focus{
 border-color:rgba(139,92,246,.55);
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding-bottom:3px;
 scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter{
 white-space:nowrap;
 padding:9px 13px;
 border-radius:12px;
 background:#111116;
 color:#888893;
 border:1px solid var(--line);
 font-size:12px;
 font-weight:850;
}
.filter.active{
 background:rgba(139,92,246,.18);
 color:#d7c6ff;
 border-color:rgba(139,92,246,.42);
}

.slot-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:11px;
}

.slot-card{
 position:relative;
 overflow:hidden;
 border-radius:20px;
 min-height:205px;
 background:#111116;
 border:1px solid rgba(255,255,255,.07);
 box-shadow:0 12px 30px rgba(0,0,0,.25);
}
.slot-art{
 height:128px;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
}
.slot-art:before,
.slot-art:after{
 content:"";
 position:absolute;
 border-radius:50%;
 filter:blur(2px);
}
.slot-art:before{
 width:130px;height:130px;
 background:var(--accent);
 opacity:.13;
}
.slot-art:after{
 width:70px;height:70px;
 border:1px solid rgba(255,255,255,.16);
 transform:rotate(25deg);
}

.art-title{
 z-index:2;
 text-align:center;
 font-weight:1000;
 font-size:18px;
 line-height:1;
 letter-spacing:-.7px;
 text-shadow:0 4px 20px #000;
 padding:0 12px;
}
.art-title small{
 display:block;
 font-size:9px;
 letter-spacing:2px;
 color:rgba(255,255,255,.65);
 margin-bottom:7px;
}

.slot-card-body{padding:10px 11px 11px}
.slot-name{
 font-size:13px;
 font-weight:900;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.slot-meta{
 display:flex;
 justify-content:space-between;
 color:#777783;
 font-size:10px;
 margin-top:5px;
}
.play-row{
 display:flex;
 gap:7px;
 margin-top:9px;
}
.play-btn{
 flex:1;
 padding:10px;
 border-radius:11px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:#050507;
 font-weight:1000;
 font-size:11px;
}
.star{
 width:38px;
 border-radius:11px;
 background:#1b1b21;
 color:#777783;
}
.star.active{color:var(--gold)}

.badge{
 position:absolute;
 z-index:5;
 top:8px;left:8px;
 padding:5px 7px;
 border-radius:8px;
 font-size:8px;
 font-weight:1000;
 background:rgba(0,0,0,.55);
 backdrop-filter:blur(8px);
 border:1px solid rgba(255,255,255,.1);
}

.bottom-nav{
 position:fixed;
 z-index:100;
 bottom:0;left:0;right:0;
 height:76px;
 padding:7px 8px calc(7px + env(safe-area-inset-bottom));
 display:flex;
 justify-content:center;
 background:rgba(8,8,10,.92);
 backdrop-filter:blur(22px);
 border-top:1px solid var(--line);
}
.nav-inner{
 width:100%;
 max-width:600px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
}
.nav-btn{
 background:transparent;
 color:#696974;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:4px;
 font-size:10px;
 font-weight:800;
}
.nav-btn .ni{font-size:20px}
.nav-btn.active{color:var(--gold)}

.back{
 display:flex;
 align-items:center;
 gap:8px;
 color:#aaaab4;
 background:transparent;
 padding:4px 0 12px;
 font-weight:800;
}

.game-page{
 padding:10px 9px 35px;
 max-width:900px;
 margin:auto;
}

.game-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 margin-bottom:10px;
}
.game-title{
 font-size:18px;
 font-weight:1000;
}
.game-top-right{
 display:flex;
 gap:6px;
}
.icon-btn{
 width:37px;height:37px;
 border-radius:11px;
 background:#15151b;
 border:1px solid var(--line);
 color:#aaaab4;
}
.icon-btn.active{color:var(--gold)}

.jackpot{
 text-align:center;
 padding:9px;
 border-radius:14px;
 background:linear-gradient(90deg,rgba(247,201,72,.05),rgba(139,92,246,.08),rgba(247,201,72,.05));
 border:1px solid rgba(247,201,72,.12);
 margin-bottom:9px;
}
.jackpot small{
 display:block;
 color:#777783;
 font-size:8px;
 letter-spacing:2px;
 font-weight:900;
}
.jackpot strong{
 color:var(--gold2);
 font-size:20px;
 letter-spacing:1px;
}

.machine{
 border-radius:27px;
 padding:9px;
 background:
 linear-gradient(145deg,#5f4b1c,#1b160b 12%,#090909 55%,#3e3216);
 border:2px solid #7f672b;
 box-shadow:
 inset 0 0 0 2px #17130a,
 inset 0 0 25px rgba(247,201,72,.12),
 0 25px 60px rgba(0,0,0,.65);
}

.machine-inner{
 border-radius:20px;
 overflow:hidden;
 background:#050506;
 border:1px solid rgba(247,201,72,.25);
}

.machine-head{
 min-height:68px;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 background:
 radial-gradient(circle,#382c0f,transparent 55%),
 linear-gradient(#17130a,#080807);
 border-bottom:1px solid rgba(247,201,72,.25);
}
.machine-head h1{
 margin:0;
 font-size:24px;
 font-weight:1000;
 color:var(--gold2);
 text-shadow:0 0 18px rgba(247,201,72,.35),0 3px 0 #5d4514;
}
.machine-head small{
 position:absolute;
 bottom:6px;
 font-size:7px;
 letter-spacing:3px;
 color:#87743e;
}

.reel-window{
 padding:7px;
 background:
 linear-gradient(90deg,#0d0d0d,#22221e 50%,#0d0d0d);
}

.reels{
 display:grid;
 grid-template-columns:repeat(var(--cols),1fr);
 gap:4px;
}
.reel{
 min-width:0;
 aspect-ratio:.72;
 overflow:hidden;
 position:relative;
 border-radius:8px;
 background:
 linear-gradient(90deg,#c7c7c7,#fff,#a5a5a5);
 box-shadow:inset 0 0 10px rgba(0,0,0,.45);
}
.reel:after{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 background:linear-gradient(180deg,rgba(0,0,0,.48),transparent 25%,transparent 73%,rgba(0,0,0,.52));
}
.cell{
 position:absolute;
 left:0;right:0;
 display:flex;
 align-items:center;
 justify-content:center;
}
.symbol{
 width:82%;
 height:82%;
 border-radius:12px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 position:relative;
 overflow:hidden;
 font-weight:1000;
 color:#fff;
 text-shadow:0 2px 4px #000;
 box-shadow:inset 0 0 12px rgba(255,255,255,.14),0 2px 5px rgba(0,0,0,.35);
}
.symbol:after{
 content:"";
 position:absolute;
 left:-20%;right:-20%;top:-35%;
 height:45%;
 background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);
 transform:rotate(-8deg);
}
.symbol .emoji{
 font-size:clamp(24px,8vw,43px);
 line-height:1;
 filter:drop-shadow(0 3px 3px #000);
 z-index:1;
}
.symbol .label{
 font-size:clamp(7px,2vw,10px);
 letter-spacing:.5px;
 margin-top:3px;
 z-index:1;
}
.symbol.low{background:linear-gradient(145deg,#263248,#111827)}
.symbol.mid{background:linear-gradient(145deg,#174d50,#071c1d)}
.symbol.high{background:linear-gradient(145deg,#654512,#251607)}
.symbol.gem{background:linear-gradient(145deg,#5730a4,#160b30)}
.symbol.wild{background:linear-gradient(145deg,#a54a0a,#3a1104);border:2px solid #ffd866}
.symbol.scatter{background:linear-gradient(145deg,#7d2157,#230717);border:2px solid #ff74bd}

.reel.spinning .cell{
 animation:reelMove .11s linear infinite;
}
@keyframes reelMove{
 0%{transform:translateY(-12px)}
 50%{transform:translateY(12px)}
 100%{transform:translateY(-12px)}
}

.win-cell{
 animation:winPulse .65s ease-in-out infinite alternate;
 z-index:4;
}
@keyframes winPulse{
 from{filter:brightness(1)}
 to{filter:brightness(1.8);transform:scale(1.04)}
}

.win-panel{
 min-height:52px;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:#0c0c0d;
 border-top:1px solid rgba(247,201,72,.14);
 border-bottom:1px solid rgba(247,201,72,.14);
}
.win-panel small{
 color:#777783;
 font-size:8px;
 letter-spacing:2px;
 font-weight:900;
}
.win-amount{
 color:var(--gold2);
 font-size:23px;
 font-weight:1000;
 text-shadow:0 0 18px rgba(247,201,72,.25);
}
.message{
 font-size:10px;
 color:#90909a;
 min-height:16px;
}

.game-info{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:9px 7px;
 background:#09090a;
 color:#74747d;
 font-size:9px;
}
.game-info b{color:#b7b7c0}

.game-controls{
 padding:11px 7px 13px;
 background:
 linear-gradient(#0c0c0d,#09090a);
}

.bet-line{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 margin-bottom:10px;
}
.bet-btn{
 width:36px;height:36px;
 border-radius:10px;
 background:#17171c;
 border:1px solid var(--line);
 font-weight:1000;
}
.bet-display{
 min-width:115px;
 text-align:center;
}
.bet-display small{
 display:block;
 color:#707079;
 font-size:8px;
 letter-spacing:1px;
}
.bet-display strong{
 font-size:17px;
 color:#ddd;
}

.spin-row{
 display:grid;
 grid-template-columns:1fr 1.6fr 1fr;
 gap:7px;
}
.control-btn{
 height:45px;
 border-radius:13px;
 background:#17171c;
 border:1px solid var(--line);
 color:#aaaab3;
 font-size:10px;
 font-weight:1000;
}
.spin{
 background:linear-gradient(145deg,var(--gold2),#d99f20);
 color:#171000;
 font-size:14px;
 box-shadow:0 6px 20px rgba(247,201,72,.15);
}
.spin.spinning{
 background:linear-gradient(145deg,#b8b8bd,#73737a);
 color:#151519;
}
.auto-on{
 border-color:rgba(139,92,246,.5);
 color:#c9b5ff;
 background:rgba(139,92,246,.12);
}

.extra-controls{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-top:7px;
}
.extra-controls button{height:36px}

.game-paytable{
 margin-top:10px;
 border-radius:17px;
 background:#101015;
 border:1px solid var(--line);
 overflow:hidden;
}
.pay-head{
 padding:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.pay-head strong{font-size:13px}
.pay-head span{font-size:10px;color:#777783}
.pay-list{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 border-top:1px solid var(--line);
}
.pay-item{
 padding:10px;
 display:flex;
 align-items:center;
 gap:9px;
 border-right:1px solid var(--line);
 border-bottom:1px solid var(--line);
}
.pay-icon{
 width:39px;height:39px;
 display:grid;place-items:center;
 border-radius:10px;
 background:#19191f;
 font-size:22px;
}
.pay-item b{font-size:11px}
.pay-item small{display:block;color:#777783;font-size:9px;margin-top:2px}

.overlay{
 position:fixed;
 z-index:300;
 inset:0;
 background:rgba(0,0,0,.78);
 backdrop-filter:blur(12px);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.modal{
 width:min(500px,100%);
 max-height:85vh;
 overflow:auto;
 border-radius:22px;
 background:#111116;
 border:1px solid rgba(255,255,255,.1);
 box-shadow:0 30px 100px rgba(0,0,0,.7);
}
.modal-head{
 padding:16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--line);
}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:16px;color:#9a9aa4;font-size:13px;line-height:1.55}
.modal-close{
 width:32px;height:32px;
 border-radius:10px;
 background:#1c1c22;
}
.modal-pay{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:12px;
}
.modal-pay div{
 padding:11px;
 border-radius:12px;
 background:#19191f;
}
.modal-pay b{color:#fff;display:block;margin-bottom:4px}
.modal-pay span{color:var(--gold2);font-weight:900}

.bigwin{
 position:fixed;
 z-index:400;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 pointer-events:none;
 background:radial-gradient(circle,rgba(247,201,72,.13),transparent 55%);
}
.bigwin-box{
 text-align:center;
 animation:bigIn .45s cubic-bezier(.2,1.5,.4,1);
}
.bigwin-box small{
 display:block;
 color:#fff;
 letter-spacing:5px;
 font-size:12px;
 font-weight:1000;
}
.bigwin-box strong{
 display:block;
 font-size:clamp(48px,15vw,90px);
 color:var(--gold2);
 text-shadow:0 0 30px rgba(247,201,72,.5),0 8px 0 #745515;
}
@keyframes bigIn{
 from{opacity:0;transform:scale(.4)}
 to{opacity:1;transform:scale(1)}
}

.coins{
 position:fixed;
 z-index:390;
 inset:0;
 pointer-events:none;
 overflow:hidden;
}
.coin-particle{
 position:absolute;
 width:9px;height:9px;
 border-radius:50%;
 background:var(--gold2);
 box-shadow:0 0 9px var(--gold);
 animation:coinFall 1.2s linear forwards;
}
@keyframes coinFall{
 0%{transform:translateY(-20px) rotate(0);opacity:1}
 100%{transform:translateY(110vh) rotate(700deg);opacity:0}
}

.profile-card{
 padding:20px;
 border-radius:22px;
 background:#111116;
 border:1px solid var(--line);
}
.avatar{
 width:70px;height:70px;
 border-radius:22px;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#8b5cf6,#352064);
 font-size:31px;
 font-weight:1000;
 margin-bottom:13px;
}
.profile-card h2{margin:0}
.profile-card p{color:#777783;margin:5px 0 0}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:18px;
}
.stat{
 padding:12px 7px;
 border-radius:13px;
 background:#19191f;
 text-align:center;
}
.stat b{display:block;font-size:15px}
.stat span{color:#777783;font-size:9px}
.logout{
 margin-top:13px;
 width:100%;
 padding:13px;
 border-radius:13px;
 background:#1a1112;
 color:#ef7777;
 border:1px solid rgba(239,68,68,.15);
 font-weight:900;
}

.toast{
 position:fixed;
 z-index:500;
 left:50%;
 bottom:92px;
 transform:translate(-50%,20px);
 opacity:0;
 pointer-events:none;
 padding:11px 15px;
 border-radius:12px;
 background:#1a1a20;
 border:1px solid rgba(255,255,255,.1);
 box-shadow:0 12px 30px rgba(0,0,0,.4);
 font-size:12px;
 font-weight:800;
 transition:.25s;
 white-space:nowrap;
}
.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

@media(min-width:650px){
 .slot-grid{grid-template-columns:repeat(3,1fr)}
 .slot-art{height:145px}
}
</style>
</head>

<div id="app" class="app"></div>

function randomSymbol(g){
 const list=g.symbols;
 const weights=list.map((s,i)=>{
  let w=100;
  if(i<5)w=150;
  if(i>=7)w=65;
  if(i===9)w=35;

  if(isNewPlayer()){
   if(i<5)w*=1.18;
   if(i>=5&&i<8)w*=1.05;
  }

  return w;
 });

 let total=weights.reduce((a,b)=>a+b,0);
 let r=Math.random()*total;
 for(let i=0;i<list.length;i++){
  r-=weights[i];
  if(r<=0)return list[i][0];
 }
 return list[0][0];
}

function findSym(g,id){
 return g.symbols.find(s=>s[0]===id)||g.symbols[0];
}

function symbolHTML(g,id){
 const s=findSym(g,id);
 let cls=s[2];

 if(id===g.wild)cls="wild";
 if(id===g.scatter)cls="scatter";

 return `
 <div class="symbol ${cls}">
  <div class="emoji">${iconForSymbol(s)}</div>
  <div class="label">${esc(id)}</div>
 </div>`;
}

function generateGrid(g){
 const rows=g.rows;
 const cols=g.reels;
 const grid=Array.from({length:rows},()=>Array(cols).fill(""));
 for(let r=0;r<rows;r++)
  for(let c=0;c<cols;c++)
   grid[r][c]=randomSymbol(g);

 return grid;
}

     ${symbolHTML(g,game.reels[r][c])}

   `).join("")}
  </div>
 `).join("");
}

function canSpin(){
 if(state.freeSpins>0)return true;
 return state.balance>=state.bet;
}

function calculateWin(g,grid){
 let total=0;
 let cells=[];
 let lineWins=0;

 const lineCount=Math.min(g.lines,PAYLINES.length);

 for(let l=0;l<lineCount;l++){
  const line=PAYLINES[l];
  const first=grid[line[0]][0];

  if(first===g.scatter)continue;

  let count=1;
  let used=[ [line[0],0] ];

  for(let c=1;c<g.reels;c++){
   const sym=grid[line[c]][c];

   if(sym===first||sym===g.wild||first===g.wild){
    count++;
    used.push([line[c],c]);
   }else break;
  }

  if(count>=3){
   const base=findSym(g,first);
   let multiplier=base?base[3]:1;

   if(first===g.wild)multiplier=12;

   let lineWin=state.bet*multiplier*(count===3?1:count===4?2.2:5);
   lineWin*=state.freeMult;

   total+=Math.floor(lineWin);
   cells.push(...used);
   lineWins++;
  }
 }

 let scatters=0;
 for(let r=0;r<g.rows;r++)
  for(let c=0;c<g.reels;c++)
   if(grid[r][c]===g.scatter)scatters++;

 if(scatters>=3){
  const bonus=state.bet*(scatters===3?3:scatters===4?8:25);
  total+=Math.floor(bonus*state.freeMult);

  for(let r=0;r<g.rows;r++)
   for(let c=0;c<g.reels;c++)
    if(grid[r][c]===g.scatter)cells.push([r,c]);

  if(scatters===3)state.freeSpins+=6;
  if(scatters===4)state.freeSpins+=10;
  if(scatters>=5)state.freeSpins+=15;

  state.freeMult=Math.min(5,state.freeMult+1);
 }

 return {total,cells,lineWins,scatters};
}

function firstDayBoost(g,result){
 if(!isNewPlayer())return result;

 /*
   Transparent demo-mode assistance:
   if there are no wins for two consecutive spins,
   the next spin receives a small virtual-game bonus.
 */
 if(result.total<=0){
  state.pity++;
 }else{
  state.pity=0;
 }

 if(state.pity>=3){
  state.pity=0;
  const forced=Math.max(10,Math.floor(state.bet*.35));
  result.total=forced;
  result.forced=true;
 }

 return result;
}

async function spin(){
 if(game.spinning)return;

 const g=game.current||slot(state.current);

 if(!canSpin()){
  toast("Not enough virtual JC");
  game.auto=false;
  state.auto=false;
  save();
  return;
 }

 game.spinning=true;

 const spinBtn=document.getElementById("spinButton");
 if(spinBtn){
  spinBtn.disabled=true;
  spinBtn.classList.add("spinning");
  spinBtn.textContent="ROLLING";
 }

 if(state.freeSpins>0){
  state.freeSpins--;
 }else{
  state.balance-=state.bet;
 }

 state.spins++;
 save();

 const reels=[...document.querySelectorAll(".reel")];
 reels.forEach((r,i)=>{
  r.classList.add("spinning");
  r.innerHTML=Array.from({length:g.rows},(_,r2)=>`
   <div class="cell" style="top:${r2*(100/g.rows)}%;height:${100/g.rows}%">
    ${symbolHTML(g,randomSymbol(g))}
   </div>`).join("");
 });

 if(state.sound)beep(130,.04);

 const duration=state.turbo?350:760;

 await new Promise(resolve=>setTimeout(resolve,duration));

 game.reels=generateGrid(g);

 reels.forEach((r,c)=>{
  r.classList.remove("spinning");
  r.innerHTML=Array.from({length:g.rows},(_,r2)=>`
   <div class="cell" style="top:${r2*(100/g.rows)}%;height:${100/g.rows}%">
    ${symbolHTML(g,game.reels[r2][c])}
   </div>`).join("");
 });

 let result=calculateWin(g,game.reels);
 result=firstDayBoost(g,result);

 state.balance+=result.total;

 if(result.total>0){
  state.wins++;
  state.totalWin+=result.total;
  state.bestWin=Math.max(state.bestWin,result.total);
 }

 save();

 document.getElementById("winAmount").textContent=money(result.total);

 const msg=document.getElementById("gameMessage");

 if(result.forced){
  msg.textContent="✨ NEW PLAYER BONUS EVENT";
 }else if(result.scatters>=3){
  msg.textContent=`FREE SPINS +${result.scatters===3?6:result.scatters===4?10:15} · MULTIPLIER x${state.freeMult}`;
 }else if(result.total>0){
  msg.textContent=result.total>=state.bet*10?"🔥 BIG WIN":"WINNING COMBINATION";
 }else{
  msg.textContent=isNewPlayer()?"✨ NEW PLAYER MODE":"Try again";
 }

 highlightCells(result.cells||[]);

 if(result.total>=state.bet*10){
  showBigWin(result.total);
  if(state.sound)beep(600,.14);
 }else if(result.total>0&&state.sound){
  beep(420,.08);
 }

 game.spinning=false;

 if(spinBtn){
  spinBtn.disabled=false;
  spinBtn.classList.remove("spinning");
  spinBtn.textContent="SPIN";
 }

 updateGameNumbers();

 if(game.auto){
  setTimeout(()=>{
   if(game.auto&&!game.spinning)spin();
  },state.turbo?100:450);
 }
}

function highlightCells(cells){
 document.querySelectorAll(".win-cell").forEach(x=>x.classList.remove("win-cell"));

 const unique=[];
 const seen=new Set();

 cells.forEach(([r,c])=>{
  const key=r+"-"+c;
  if(!seen.has(key)){
   seen.add(key);
   unique.push([r,c]);
  }
 });

 unique.forEach(([r,c])=>{
  const reel=document.getElementById("reel-"+c);
  if(!reel)return;
  const cell=reel.children[r];
  if(cell){
   const s=cell.querySelector(".symbol");
   if(s)s.classList.add("win-cell");
  }
 });
}

function beep(freq,duration){
 if(!state.sound)return;

 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;

  if(!window.audioCtx)window.audioCtx=new AC();

  const o=window.audioCtx.createOscillator();
  const g=window.audioCtx.createGain();

  o.frequency.value=freq;
  o.type="sine";
  g.gain.value=.025;

  o.connect(g);
  g.connect(window.audioCtx.destination);

  o.start();
  g.gain.exponentialRampToValueAtTime(.001,window.audioCtx.currentTime+duration);
  o.stop(window.audioCtx.currentTime+duration);
 }catch(e){}
}
